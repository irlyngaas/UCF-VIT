# ---------------------------- TRAINER -------------------------------------------
trainer:
  max_epochs: 100
  data_type: "float32" #float 32 or bfloat16
  gpu_type: "amd" #amd or nvidia
  checkpoint_path: "../../checkpoint/basic_ct/mae/base"
  resume_from_checkpoint: False
  checkpoint_filename: "epoch_0"
  use_pretrained_model: False
  pretrained_checkpoint_filename: ""
  save_frequency: 2

# ---------------------------- PARALLELISM ---------------------------------------
parallelism:
  fsdp_size: 1
  simple_ddp_size: 8
  tensor_par_size: 1

# ---------------------------- OPTIMIZER -----------------------------------------
optimizer:
  type: "AdamW"
  lr: 0.0001
  beta_1: 0.9
  beta_2: 0.95
  weight_decay: 1e-5

# ---------------------------- SCHEDULER -----------------------------------------
scheduler:
  type: "linear-warmup-cosine-annealing"
  warmup_epochs: 4
  warmup_start_lr: 1e-8
  eta_min: 1e-8

# ---------------------------- GRAD SCALER ---------------------------------------
grad_scaler:
  use_grad_scaler: False
  init_scale: 8192
  min_scale: 128
  growth_interval: 100

# ---------------------------- MODEL ---------------------------------------------
model:
  type: "MAE"
  embed_dim: 768
  depth: 12
  num_heads: 12
  mlp_ratio: 4
  drop_path: 0.0
  drop_rate: 0.0
  use_channel_aggregation: False

  loss_fn: "MSE" #"MSE" (every patch, masked and visible) or "maskMSE" (only the masked/encoder-hidden patches -- the standard MAE-paper loss). Under ap.do_ap:True, also "nativeResMSE"/"nativeResMaskMSE" (compares against the real, native-resolution image region each adaptive patch covers, not the already-resized fixed-interp_size token "MSE"/"maskMSE" compare against)
  mask_ratio: 0.75
  linear_decoder: False
  decoder_embed_dim: 480 # must be divisible by 3 (get_3d_sincos_pos_embed, twoD:False) and by decoder_num_heads; 512 no longer satisfies the former
  decoder_depth: 8
  decoder_num_heads: 16
  decoder_mlp_ratio: 4
  
# ---------------------------- TILING --------------------------------------------
tiling:
  do_tiling: False
  div: 1
  tile_overlap: 0
  use_all_data: False

# ---------------------------- AP ------------------------------------------------

ap:
  do_ap: False
  fixed_length: 196
  separate_channels: False
  use_adaptive_pos_emb: True
  interp_size: 32 # Side length each adaptive leaf patch is interpolated to (see UCF_VIT.model.arch.VIT.effective_patch_size); only used when do_ap:True, ignored otherwise. Not used by this baseline (do_ap:False) -- shown here so it's easy to find if you turn adaptive patching on.
  
# ---------------------------- DATA ----------------------------------------------
data:
  dataset: "basic_ct"
  img_size: [256, 256, 256] #Can be 2D or 3D. Optional -- if omitted, auto-detected from the real data files under dict_root_dirs (see UCF_VIT.utils.misc.detect_img_size). Always the actual/native size of the data, never a resize target.
  twoD: False #If true when img_size is 3D, dataloader slices on the z dimension. If data is 2D, this variable will be ignored and default to True
  patch_size: 32 #Only used when do_ap:False (standard patching); changes sequence length. Ignored when do_ap:True -- see ap.interp_size for that case's equivalent.
  dict_root_dirs: {
    'ct1': '/lustre/orion/stf006/proj-shared/irl1/Tr8_Training',
  }
  num_channels: {
    'ct1': 1,
  } #Important to define because not all datasets need to have the same channels or amount of channels when using variable aggregation depending on the training task chosen
  dict_in_variables: {
    'ct1': [
     "ct_res1", 
    ],
  } #Needs to match the order of the channels in the raw data files, if using variable aggregation. If not using variable aggregation you may just fill this in with placeholders using the correct amount of channels as this will not be used
  
# ---------------------------- DATALOADER ----------------------------------------
dataloader:
  type: "iterative_dataloader"
  dict_start_idx: {
    'ct1': 0,
  }
  dict_end_idx: {
    'ct1': 1,
  }
  dict_buffer_sizes: {
    'ct1': 100,
  }
  batch_size: 32
  num_workers: 1
  pin_memory: False
