# ---------------------------- TRAINER -------------------------------------------
trainer:
  max_epochs: 600
  data_type: "float32" #float 32 or bfloat16
  gpu_type: "amd" #amd or nvidia
  checkpoint_path: "checkpoint/basic_ct/sap/base"
  resume_from_checkpoint: False
  checkpoint_filename: "epoch_0"
  use_pretrained_model: False
  pretrained_checkpoint_filename: ""
  save_frequency: 2

# ---------------------------- PARALLELISM ---------------------------------------
parallelism:
  fsdp_size: 1
  simple_ddp_size: 8
  tensor_par_size: 1

# ---------------------------- OPTIMIZER -----------------------------------------
optimizer:
  type: "AdamW"
  lr: 0.0001
  beta_1: 0.9
  beta_2: 0.95
  weight_decay: 1e-5

# ---------------------------- SCHEDULER -----------------------------------------
scheduler:
  type: "linear-warmup-cosine-annealing"
  warmup_epochs: 4
  warmup_start_lr: 1e-8
  eta_min: 1e-8

# ---------------------------- GRAD SCALER ---------------------------------------
grad_scaler:
  use_grad_scaler: False
  init_scale: 8192
  min_scale: 128
  growth_interval: 100

# ---------------------------- MODEL ---------------------------------------------
model:
  type: "SAP"
  embed_dim: 768
  depth: 12
  num_heads: 12
  mlp_ratio: 4
  drop_path: 0.0
  drop_rate: 0.0
  use_channel_aggregation: False

  num_classes: 4
  
# ---------------------------- TILING --------------------------------------------
tiling:
  do_tiling: False
  div: 1
  tile_overlap: 0
  use_all_data: False

# ---------------------------- AP ------------------------------------------------

ap:
  do_ap: True # SAP requires adaptive patching; this is the one exception to the basic_ct baseline's do_ap:False
  fixed_length: 512 # cube root must be a whole number and fixed_length % 7 == 1 (octree, since twoD:False) -- 8**3
  separate_channels: False
  use_adaptive_pos_emb: True
  interp_size: 4 # SAP exception: its neck is a single ConvTranspose3d(kernel=stride=interp_size), memory scales as interp_size**3 -- interp_size:32 OOM'd requesting 512x (exactly (32/4)**3) more memory than this reverted value

# ---------------------------- DATA ----------------------------------------------
data:
  dataset: "basic_ct"
  img_size: [256, 256, 256] #Can be 2D or 3D. Optional -- if omitted, auto-detected from the real data files under dict_root_dirs (see UCF_VIT.utils.misc.detect_img_size). Always the actual/native size of the data, never a resize target.
  twoD: False #If true when img_size is 3D, dataloader slices on the z dimension. If data is 2D, this variable will be ignored and default to True
  dict_root_dirs: {
    'ct1': '/lustre/orion/stf006/proj-shared/irl1/Tr8_Training',
  }
  num_channels: {
    'ct1': 1,
  } #Important to define because not all datasets need to have the same channels or amount of channels when using variable aggregation depending on the training task chosen
  dict_in_variables: {
    'ct1': [
     "ct_res1", 
    ],
  } #Needs to match the order of the channels in the raw data files, if using variable aggregation. If not using variable aggregation you may just fill this in with placeholders using the correct amount of channels as this will not be used
  
# ---------------------------- DATALOADER ----------------------------------------
dataloader:
  type: "iterative_dataloader"
  dict_start_idx: {
    'ct1': 0,
  }
  dict_end_idx: {
    'ct1': 1,
  }
  dict_buffer_sizes: {
    'ct1': 100,
  }
  batch_size: 32
  # SAP always does adaptive patching (do_ap:True) on 3D basic_ct volumes -- the
  # heaviest per-sample CPU workload of any shipped config's DataLoader worker,
  # combined with tensor_par_size>1 here, was the original trigger for a real
  # fork-after-CUDA-init segfault (see tests/README.md's "Fixed the
  # fork-after-CUDA-init segfault at its root" entry) -- fixed by building the
  # DataLoader before CUDA is ever initialized, not by disabling workers.
  num_workers: 1
  pin_memory: False
  # Optional -- default 0.1/0.1 when omitted (see UCF_VIT.parse._resolve_dataset_splits).
  # Only used for dataset keys with no separate data.dict_val_root_dirs/dict_test_root_dirs
  # entry: reserves this fraction of that key's own [dict_start_idx, dict_end_idx) window for
  # val.py/test.py, narrowing what train.py itself uses down from dict_end_idx accordingly.
  val_split_ratio: 0.1
  test_split_ratio: 0.1
