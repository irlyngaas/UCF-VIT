# Fresh 3D NCT training with a direct spatial Conv3D prediction head.
# Uses 80% (768 volumes) on 32 Frontier nodes / 256 TP1 replicas, giving
# exactly three volumes per replica and 384 batches per epoch.
parallelism:
  fsdp_size: 1
  simple_ddp_size: "auto"
  tensor_par_size: 1
  seq_par_size: 1
  cpu_offloading: False

trainer:
  max_epochs: 52
  data_type: "bfloat16"
  reduce_data_type: "float32"
  gpu_type: "amd"
  log_every_n_steps: 25
  enable_performance_plots: False
  loss_plot_period: 1
  checkpoint_period: 5
  generation_period: 5
  generate_on_allocation_start: False
  preview_seed: 1234
  save_checkpoints: True
  auto_checkpoint_path: True
  checkpoint_root: "/lustre/orion/world-shared/gen006/AmirZ/Checkpoints_Frontier_FY26/NeutronCT_512x512x512_Standardized/3D_Tile64/Pat2000_Dec0.9/SpatialConv3D_Fresh80P"
  checkpoint_path: null
  checkpoint_filename: "NCT_3D_T64_P4_TP1_SPATIALCONV3D_C8_FRESH80P"
  checkpoint_filename_for_loading: "NCT_3D_T64_P4_TP1_SPATIALCONV3D_C8_FRESH80P_BEST_0"
  resume_checkpoint_path: null
  inference_path: null
  resume_from_checkpoint: False
  reset_optimizer_on_resume: False
  reset_scheduler_on_resume: False
  reset_best_metrics_on_resume: False

model:
  # This matches the successful original large-batch 3D starting scale. The
  # recovery controller makes meaningful 5x reductions after a true plateau.
  lr: 0.0001
  beta_1: 0.9
  beta_2: 0.95
  weight_decay: 1e-5
  warmup_steps: 1000
  max_steps: 19968
  warmup_start_lr: 1e-8
  eta_min: 1e-7
  ema_decay: 0.999
  loss_fn: "MSE"
  use_grad_scaler: False
  max_grad_norm: 1.0
  fused_attn: "DEFAULT"

  net:
    init_args:
      default_vars: ["nct"]
      tile_size: [64, 64, 64]
      patch_size: 4
      embed_dim: 768
      depth: 8
      num_heads: 12
      decoder_embed_dim: 768
      decoder_depth: 8
      decoder_num_heads: 12
      mlp_ratio: 6
      mlp_ratio_decoder: 4
      drop_path: 0.1
      drop_rate: 0.0
      linear_decoder: True
      residual_mlp_decoder: False
      residual_conv3d_decoder: False
      residual_feature_conv3d_decoder: False
      spatial_feature_conv3d_decoder: True
      spatial_feature_conv3d_channels: 8
      twoD: False
      use_varemb: False
      adaptive_patching: False
      fixed_length: 196
      separate_channels: False
      num_time_steps: 1000

data:
  dataset: "xct"
  dict_root_dirs:
    nct1: "/lustre/orion/world-shared/gen006/AmirZ/NeutronCT_Concrete_512x512x512_Standardized"
  dict_start_idx:
    nct1: 0
  dict_end_idx:
    nct1: 0.8
  dict_buffer_sizes:
    nct1: 64
  num_channels_used:
    nct1: 1
  dict_in_variables:
    nct1: ["nct"]
  batch_size: 4
  num_workers: 1
  pin_memory: False
  single_channel: False
  tile_overlap: 0.0
  use_all_data: False

load_balancing:
  auto_load_balancing: True
  batches_per_rank_epoch:
    nct1: 384
  dataset_group_list: "256"

numerical_recovery:
  enabled: True
  lr_decay_factor: 0.2
  min_lr: 1e-7
  max_retries: 3
  plateau_patience: 4
  stop_after_max_retries: True
  ema_alpha: 0.3
  loss_degradation_factor: 1.25
  loss_degradation_patience: 3
  modality_degradation_factor: 1.30
  modality_degradation_patience: 3
