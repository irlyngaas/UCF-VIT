# ---------------------------- PARALLELISM -------------------------------------
parallelism:
  fsdp_size: 1
  # "auto" derives this dimension from the Slurm world size after accounting
  # for FSDP, tensor-parallel, and sequence-parallel dimensions.
  simple_ddp_size: "auto"
  tensor_par_size: 1
  seq_par_size: 1
  cpu_offloading: False

# ---------------------------- TRAINER -------------------------------------------
trainer:
  max_epochs: 5
  data_type: "float32"
  reduce_data_type: "float32"
  gpu_type: "amd"
  log_every_n_steps: 25
  enable_performance_plots: False
  save_checkpoints: False
  auto_checkpoint_path: True
  checkpoint_root: "/lustre/orion/world-shared/gen006/AmirZ/Checkpoints_Frontier_FY26/NeutronCT_Concrete_512x512x512_Standardized/Pat2000_Dec0.9" #256x256x256_227Volumes_Standardized/Pat2000_Dec0.9
  checkpoint_path: null
  checkpoint_filename: "XCT512_NO_SHARD_float32"
  checkpoint_filename_for_loading: "XCT512_NO_SHARD_float32_0"
  inference_path: null
  resume_from_checkpoint: False


# ---------------------------- MODEL -------------------------------------------
model:
  lr: 0.001
  beta_1: 0.9
  beta_2: 0.95
  weight_decay: 1e-5
  warmup_steps: 1000
  max_steps: 20000
  warmup_start_lr: 1e-8
  eta_min: 1e-8
  loss_fn: "MSE"
  use_grad_scaler: False #True
  max_grad_norm: 1.0
  fused_attn: "DEFAULT"

  net:
    init_args:
      default_vars: [
        "xct",
      ]
      tile_size: [256, 256, 256] #[32,32,32] #
      patch_size: 8 #8 # 1
      embed_dim: 1024 #512 #1024
      depth: 8 # 10
      num_heads: 8
      decoder_embed_dim: 1024 # 576
      decoder_depth: 8
      decoder_num_heads: 16
      mlp_ratio: 6
      mlp_ratio_decoder: 4
      drop_path: 0.1
      drop_rate: 0.0  # 0.05 #
      linear_decoder: True
      twoD: True
      use_varemb: False
      adaptive_patching: False
      fixed_length: 196
      separate_channels: False
      num_time_steps: 1000

# ---------------------------- DATA -------------------------------------------
data:
  dataset: "xct"
  dict_root_dirs: {
    'xct1': "/lustre/orion/world-shared/gen006/AmirZ/NeutronCT_Concrete_512x512x512_Standardized",
    }
  dict_start_idx: {
    'xct1': 0,
  }
  dict_end_idx: {
    'xct1': 0.25, #1
  }
  dict_buffer_sizes: {
    'xct1': 400,
  }
  num_channels_used: {
    'xct1': 1,
  }
  dict_in_variables: {
    'xct1': [
     "xct",
    ],
  }
  batch_size: 64
  num_workers: 1
  pin_memory: False
  single_channel: False
  tile_overlap: 0.0
  use_all_data: False

# ---------------------------- LOAD BALANCING -------------------------------------------
load_balancing:
  auto_load_balancing: True
  batches_per_rank_epoch: {
  'xct1': 600,
  }
  dataset_group_list: '16' #'1:3:75:1:8:4' # '2:1' # '16' # 75:
