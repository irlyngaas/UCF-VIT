# Fresh 2D multimodal XCT/NCT training with a direct spatial Conv2D head.
# Intended for 32 Frontier nodes / 256 TP1 ranks. The 128:128 rank split
# gives equal training capacity to XCT and NCT.
parallelism:
  fsdp_size: 1
  simple_ddp_size: "auto"
  tensor_par_size: 1
  seq_par_size: 1
  cpu_offloading: False

trainer:
  max_epochs: 90
  data_type: "bfloat16"
  reduce_data_type: "float32"
  gpu_type: "amd"
  log_every_n_steps: 25
  enable_performance_plots: False
  loss_plot_period: 1
  checkpoint_period: 5
  generation_period: 5
  generate_on_allocation_start: False
  preview_seed: 1234
  save_checkpoints: True
  auto_checkpoint_path: True
  checkpoint_root: "/lustre/orion/world-shared/gen006/AmirZ/Checkpoints_Frontier_FY26/NeutronCT_XRayCT_512x512x512_Standardized/Pat2000_Dec0.9/SpatialConv2D_Fresh"
  checkpoint_path: null
  checkpoint_filename: "XCT_NCT_2D_P8_TP1_SPATIALCONV2D_C16_FRESH"
  checkpoint_filename_for_loading: "XCT_NCT_2D_P8_TP1_SPATIALCONV2D_C16_FRESH_BEST_0"
  resume_checkpoint_path: null
  inference_path: null
  resume_from_checkpoint: False
  reset_optimizer_on_resume: False
  reset_scheduler_on_resume: False
  reset_best_metrics_on_resume: False

model:
  # The old run began at 5e-3 and only established its durable best after
  # large LR reductions. Start conservatively and retain meaningful 5x cuts.
  lr: 0.0002
  beta_1: 0.9
  beta_2: 0.95
  weight_decay: 1e-5
  warmup_steps: 500
  max_steps: 20160
  warmup_start_lr: 1e-8
  eta_min: 1e-7
  ema_decay: 0.999
  loss_fn: "MSE"
  use_grad_scaler: False
  max_grad_norm: 1.0
  fused_attn: "DEFAULT"

  net:
    init_args:
      default_vars: ["xct", "nct"]
      tile_size: [256, 256, 256]
      patch_size: 8
      embed_dim: 1024
      depth: 8
      num_heads: 8
      decoder_embed_dim: 1024
      decoder_depth: 8
      decoder_num_heads: 16
      mlp_ratio: 6
      mlp_ratio_decoder: 4
      drop_path: 0.1
      drop_rate: 0.0
      linear_decoder: True
      residual_mlp_decoder: False
      residual_conv3d_decoder: False
      residual_feature_conv3d_decoder: False
      spatial_feature_conv3d_decoder: False
      spatial_feature_conv2d_decoder: True
      spatial_feature_conv2d_channels: 16
      twoD: True
      use_varemb: False
      adaptive_patching: False
      fixed_length: 196
      separate_channels: False
      num_time_steps: 1000

data:
  dataset: "xct"
  dict_root_dirs:
    xct1: "/lustre/orion/world-shared/gen006/AmirZ/XCT_Concrete_512x512x512_Standardized"
    nct1: "/lustre/orion/world-shared/gen006/AmirZ/NeutronCT_Concrete_512x512x512_Standardized"
  dict_start_idx:
    xct1: 0
    nct1: 0
  dict_end_idx:
    xct1: 0.34
    nct1: 1
  dict_buffer_sizes:
    xct1: 400
    nct1: 400
  num_channels_used:
    xct1: 1
    nct1: 1
  dict_in_variables:
    xct1: ["xct"]
    nct1: ["nct"]
  batch_size: 64
  num_workers: 1
  pin_memory: False
  single_channel: False
  tile_overlap: 0.0
  use_all_data: False

load_balancing:
  auto_load_balancing: True
  batches_per_rank_epoch:
    xct1: 224
    nct1: 224
  dataset_group_list: "128:128"

numerical_recovery:
  enabled: True
  lr_decay_factor: 0.2
  min_lr: 1e-7
  max_retries: 3
  plateau_patience: 4
  stop_after_max_retries: True
  ema_alpha: 0.3
  loss_degradation_factor: 1.25
  loss_degradation_patience: 3
  modality_degradation_factor: 1.30
  modality_degradation_patience: 3
