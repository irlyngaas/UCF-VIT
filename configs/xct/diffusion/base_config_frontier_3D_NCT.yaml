# Initial single-modality 3D NCT production run on Frontier.
# Submit on 10 nodes (80 GPUs). The first 25% of the 960 sorted NCT volumes
# gives 240 volumes, exactly three volumes per data-parallel rank.
parallelism:
  fsdp_size: 1
  simple_ddp_size: "auto"
  tensor_par_size: 1
  seq_par_size: 1
  cpu_offloading: False

trainer:
  # A 512^3 volume contains 512 non-overlapping 64^3 tiles. With three
  # volumes/rank and batch size 4, this is 384 steps/epoch; epochs 0-51 give
  # 19,968 optimizer steps, matching the cosine schedule below.
  max_epochs: 52
  data_type: "bfloat16"
  reduce_data_type: "float32"
  gpu_type: "amd"
  log_every_n_steps: 25
  enable_performance_plots: False
  loss_plot_period: 1
  checkpoint_period: 10
  generation_period: 20
  # Full 3D reverse-diffusion previews are expensive. Generate at epochs 20
  # and 40, rather than at the beginning of every one-hour allocation.
  generate_on_allocation_start: False
  preview_seed: 1234
  save_checkpoints: True
  auto_checkpoint_path: True
  checkpoint_root: "/lustre/orion/world-shared/gen006/AmirZ/Checkpoints_Frontier_FY26/NeutronCT_512x512x512_Standardized/3D_Tile64/Pat2000_Dec0.9"
  checkpoint_path: null
  checkpoint_filename: "NCT_3D_T64_P4"
  checkpoint_filename_for_loading: "NCT_3D_T64_P4_0"
  inference_path: null
  resume_from_checkpoint: False

model:
  # The global batch is 320 (80 ranks x 4). This conservative initial LR is
  # close to linear batch scaling from the stable 2D setup.
  lr: 0.00005
  beta_1: 0.9
  beta_2: 0.95
  weight_decay: 1e-5
  warmup_steps: 1000
  max_steps: 20000
  warmup_start_lr: 1e-8
  eta_min: 1e-8
  loss_fn: "MSE"
  use_grad_scaler: False
  max_grad_norm: 1.0
  fused_attn: "DEFAULT"

  net:
    init_args:
      default_vars: ["nct"]
      # 64^3 / 4^3 produces 16^3 = 4,096 tokens per sample.
      tile_size: [64, 64, 64]
      patch_size: 4
      # 768 is divisible by 3 for the current 3D sinusoidal position embedding
      # and by all configured attention-head counts.
      embed_dim: 768
      depth: 8
      num_heads: 12
      decoder_embed_dim: 768
      decoder_depth: 8
      decoder_num_heads: 12
      mlp_ratio: 6
      mlp_ratio_decoder: 4
      drop_path: 0.1
      drop_rate: 0.0
      linear_decoder: True
      twoD: False
      use_varemb: False
      adaptive_patching: False
      fixed_length: 196
      separate_channels: False
      num_time_steps: 1000

data:
  dataset: "xct"
  dict_root_dirs:
    nct1: "/lustre/orion/world-shared/gen006/AmirZ/NeutronCT_Concrete_512x512x512_Standardized"
  dict_start_idx:
    nct1: 0
  dict_end_idx:
    nct1: 0.25
  dict_buffer_sizes:
    nct1: 64
  num_channels_used:
    nct1: 1
  dict_in_variables:
    nct1: ["nct"]
  batch_size: 4
  num_workers: 1
  pin_memory: False
  single_channel: False
  tile_overlap: 0.0
  use_all_data: False

load_balancing:
  auto_load_balancing: True
  # Documentation/fallback values for the intended 10-node layout. Automatic
  # load balancing recalculates these values at startup.
  batches_per_rank_epoch:
    nct1: 384
  dataset_group_list: "80"

numerical_recovery:
  enabled: True
  lr_decay_factor: 0.2
  min_lr: 1e-6
  max_retries: 3
  ema_alpha: 0.3
  loss_degradation_factor: 1.10
  loss_degradation_patience: 3
  modality_degradation_factor: 1.20
  modality_degradation_patience: 3
