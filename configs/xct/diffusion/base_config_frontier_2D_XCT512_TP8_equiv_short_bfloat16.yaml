# Short TP8 side of the four-node TP equivalence test. Batch 64 across four
# data replicas gives the same global batch (256) as TP1 batch 8.
parallelism:
  fsdp_size: 1
  simple_ddp_size: "auto"
  tensor_par_size: 8
  seq_par_size: 1
  cpu_offloading: False

trainer:
  max_epochs: 1
  data_type: "bfloat16"
  reduce_data_type: "float32"
  gpu_type: "amd"
  log_every_n_steps: 10
  enable_performance_plots: False
  save_checkpoints: False
  auto_checkpoint_path: True
  checkpoint_root: "/lustre/orion/world-shared/gen006/AmirZ/Checkpoints_Frontier_FY26/NeutronCT_Concrete_512x512x512_Standardized/Pat2000_Dec0.9/TP_equiv_v3"
  checkpoint_path: null
  checkpoint_filename: "XCT512_TP8_equiv_short_bfloat16"
  checkpoint_filename_for_loading: "XCT512_TP8_equiv_short_bfloat16_0"
  inference_path: null
  resume_from_checkpoint: False

model:
  lr: 0.001
  beta_1: 0.9
  beta_2: 0.95
  weight_decay: 1e-5
  warmup_steps: 1000
  max_steps: 20000
  warmup_start_lr: 1e-8
  eta_min: 1e-8
  loss_fn: "MSE"
  use_grad_scaler: False
  max_grad_norm: 1.0
  fused_attn: "DEFAULT"

  net:
    init_args:
      default_vars: ["xct"]
      tile_size: [256, 256, 256]
      patch_size: 8
      embed_dim: 1024
      depth: 8
      num_heads: 8
      decoder_embed_dim: 1024
      decoder_depth: 8
      decoder_num_heads: 16
      mlp_ratio: 6
      mlp_ratio_decoder: 4
      drop_path: 0.0
      drop_rate: 0.0
      linear_decoder: True
      twoD: True
      use_varemb: False
      adaptive_patching: False
      fixed_length: 196
      separate_channels: False
      num_time_steps: 1000

data:
  dataset: "xct"
  dict_root_dirs:
    xct1: "/lustre/orion/world-shared/gen006/AmirZ/NeutronCT_Concrete_512x512x512_Standardized"
  dict_start_idx:
    xct1: 0
  dict_end_idx:
    xct1: 0.034
  dict_buffer_sizes:
    xct1: 400
  num_channels_used:
    xct1: 1
  dict_in_variables:
    xct1: ["xct"]
  batch_size: 64
  num_workers: 1
  pin_memory: False
  single_channel: False
  tile_overlap: 0.0
  use_all_data: False

load_balancing:
  auto_load_balancing: True
  batches_per_rank_epoch:
    xct1: 600
  dataset_group_list: "16"
