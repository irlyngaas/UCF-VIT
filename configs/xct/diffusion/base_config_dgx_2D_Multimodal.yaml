# Production 2D multimodal XCT/NCT run on Frontier.
# On 32 nodes this resolves to 256 data-parallel replicas.
parallelism:
  fsdp_size: 1
  simple_ddp_size: "auto"
  tensor_par_size: 1
  seq_par_size: 1
  cpu_offloading: False

trainer:
  # Epochs 0-89 give approximately 20,160 optimizer steps at 224 steps/epoch.
  max_epochs: 90
  data_type: "bfloat16"
  reduce_data_type: "float32"
  gpu_type: "amd"
  log_every_n_steps: 25
  enable_performance_plots: False
  save_checkpoints: True
  auto_checkpoint_path: True
  checkpoint_root: "/lustre/orion/world-shared/gen006/AmirZ/Checkpoints_Frontier_FY26/NeutronCT_XRayCT_512x512x512_Standardized/Pat2000_Dec0.9"
  checkpoint_path: null
  checkpoint_filename: "XCT_NCT_Conc_Norm_base"
  checkpoint_filename_for_loading: "XCT_NCT_Conc_Norm_base_0"
  inference_path: null
  resume_from_checkpoint: False

model:
  lr: 0.005
  beta_1: 0.9
  beta_2: 0.95
  weight_decay: 1e-5
  warmup_steps: 1000
  max_steps: 20000
  warmup_start_lr: 1e-8
  eta_min: 1e-8
  loss_fn: "MSE"
  use_grad_scaler: False
  max_grad_norm: 1.0
  fused_attn: "DEFAULT"

  net:
    init_args:
      default_vars: ["xct", "nct"]
      tile_size: [256, 256, 256]
      patch_size: 8
      embed_dim: 1024
      depth: 8
      num_heads: 8
      decoder_embed_dim: 1024
      decoder_depth: 8
      decoder_num_heads: 16
      mlp_ratio: 6
      mlp_ratio_decoder: 4
      drop_path: 0.1
      drop_rate: 0.0
      linear_decoder: True
      twoD: True
      use_varemb: False
      adaptive_patching: False
      fixed_length: 196
      separate_channels: False
      num_time_steps: 1000

data:
  dataset: "xct"
  dict_root_dirs:
    xct1: "/lustre/orion/world-shared/gen006/AmirZ/XCT_Concrete_512x512x512_Standardized"
    nct1: "/lustre/orion/world-shared/gen006/AmirZ/NeutronCT_Concrete_512x512x512_Standardized"
  dict_start_idx:
    xct1: 0
    nct1: 0
  dict_end_idx:
    xct1: 0.34
    nct1: 1
  dict_buffer_sizes:
    xct1: 400
    nct1: 400
  num_channels_used:
    xct1: 1
    nct1: 1
  dict_in_variables:
    xct1: ["xct"]
    nct1: ["nct"]
  batch_size: 64
  num_workers: 1
  pin_memory: False
  single_channel: False
  tile_overlap: 0.0
  use_all_data: False

load_balancing:
  auto_load_balancing: True
  # Documentation/fallback values for this exact 32-node layout. Automatic
  # load balancing recalculates them at startup.
  batches_per_rank_epoch:
    xct1: 224
    nct1: 224
  dataset_group_list: "128:128"

# If any rank encounters a non-finite loss or gradient, all ranks stop the
# current attempt together. The launcher rolls back to the best completed
# checkpoint, rebases both optimizer and scheduler, and resubmits automatically.
numerical_recovery:
  enabled: True
  lr_decay_factor: 0.2
  min_lr: 1e-5
  max_retries: 3
  # Roll back when two consecutive completed epochs exceed twice the best
  # persisted loss, even if all values remain finite.
  loss_degradation_factor: 2.0
  loss_degradation_patience: 2
