# UNETR regression on the "sst" CFD dataset, with real time-stepping: given
# u,v,w,r,p at 2 past timesteps (offsets -2 and -1), predicts u,v,w,r,p at
# *both* of the following 2 timesteps (offsets 0 and 1) in one shot -- via
# model.loss_fn:"MSE" and model.num_classes:10 (5 variables x 2 predicted
# steps), same as base_config.yaml's single-variable regression, not the
# usual classification/segmentation DiceCELoss path. One-shot, not
# autoregressive: both future steps come out of a single forward pass over
# the same past window, not by feeding a prediction back in as new input.
#
# dict_in_variables/dict_out_variables entries are [variable, offset] pairs
# (not just plain variable-name strings) -- see UCF_VIT.utils.misc.
# process_root_dirs's own docstring for the full "sst" time-stepping
# writeup, and tests/README.md's "Added time-stepping to the 'sst'
# dataloader" section for the design this was built against. Predicting
# more than one future offset needed no dataloader/model changes at all --
# dict_out_variables (and thus a predicted output channel) was never tied
# to a single distinct offset in the first place, confirmed directly via
# test_native_pytorch_data_module_sst_predicts_multiple_future_offsets_end_
# to_end. time_offsets ([-2, -1, 0, 1], every offset referenced below) is
# derived automatically by UCF_VIT.parse -- nothing to configure separately.
#
# model.use_channel_aggregation:True (unlike every other shipped UNETR
# config, which leaves this False) is required here: with time-stepped
# input, several channels are the *same* variable at different offsets --
# turning this on tokenizes each channel per-variable and runs the new
# two-stage aggregation (collapse variables within each timestep first,
# then collapse across timesteps second -- see arch.py's own use_timeemb
# docstring) instead of feeding every channel into one shared conv
# indiscriminately.
#
# Deliberately non-adaptive (ap.do_ap:False), same as base_config.yaml was
# before its own adaptive_config.yaml follow-up -- adaptive patching's
# "build one octree from a single reference past timestep, reuse it across
# every other timestep" mode (agreed with the user as the right design) is
# not implemented yet, so do_ap stays off here until that follow-up lands.
#
# See base_config.yaml's own header comment for the shared "sst" data-layout
# writeup (one flat np.memmap file per variable per timestamp, chunk-
# splitting via dataset_options.full_domain_size vs. data.img_size) -- all
# of that is unchanged and composes with time-stepping exactly as
# documented there.

# ---------------------------- TRAINER -------------------------------------------
trainer:
  max_epochs: 600
  data_type: "float32" #float 32 or bfloat16
  gpu_type: "amd" #amd or nvidia
  checkpoint_path: "checkpoint/sst/unetr/timestep"
  resume_from_checkpoint: False
  checkpoint_filename: "epoch_0"
  use_pretrained_model: False
  pretrained_checkpoint_filename: ""
  save_frequency: 2

# ---------------------------- PARALLELISM ---------------------------------------
parallelism:
  fsdp_size: 1
  simple_ddp_size: "auto" # derives from world_size at launch time (world_size / (fsdp_size * tensor_par_size)) -- see README.md's Parallelism section. Adjust fsdp_size/tensor_par_size for your real allocation size before running at scale.
  tensor_par_size: 1

# ---------------------------- OPTIMIZER -----------------------------------------
optimizer:
  type: "AdamW"
  lr: 0.00001
  beta_1: 0.9
  beta_2: 0.95
  weight_decay: 1e-5

# ---------------------------- SCHEDULER -----------------------------------------
scheduler:
  type: "linear-warmup-cosine-annealing"
  warmup_epochs: 10
  warmup_start_lr: 1e-8
  eta_min: 1e-8

# ---------------------------- GRAD SCALER ---------------------------------------
grad_scaler:
  use_grad_scaler: False
  init_scale: 8192
  min_scale: 128
  growth_interval: 100

# ---------------------------- MODEL ---------------------------------------------
model:
  type: "UNETR"
  embed_dim: 768
  depth: 12
  num_heads: 12
  mlp_ratio: 4
  drop_path: 0.0
  drop_rate: 0.0
  use_channel_aggregation: True # Required for time-stepping -- see this file's own header comment.
  loss_fn: "MSE" # Regression, not classification -- see UCF_VIT.training.forward_step's model.loss_fn dispatch. Requires num_classes to match the number of predicted (variable, offset) entries below.

  num_classes: 10 # u,v,w,r,p at both offset 0 and offset 1 (all of dict_out_variables), not a real class count -- see model.loss_fn above.
  linear_decoder: False
  feature_size: 16
  skip_connection: True
  token_selection: point # Only used when do_ap:True; not used by this baseline (do_ap:False) -- shown here so it's easy to find if you turn adaptive patching on.
  area_weighted_alpha: 0 # Only used when token_selection:area_weighted.

# ---------------------------- TILING --------------------------------------------
tiling:
  do_tiling: True
  div: 4 # data.img_size (256) / div -> tile_size 64 in every dimension, matching base_config.yaml.
  tile_overlap: 0
  use_all_data: False

# ---------------------------- AP ------------------------------------------------

ap:
  do_ap: False # See this file's own header comment -- adaptive patching's time-reuse mode isn't implemented yet.
  fixed_length: 512
  separate_channels: False
  use_adaptive_pos_emb: True
  interp_size: 32 # Only used when do_ap:True; not used by this baseline (do_ap:False) -- shown here so it's easy to find if you turn adaptive patching on.
  do_gpu_ap: False # Whether adaptive patching runs on-device inside the model's forward() (UCF_VIT.model.gpu_adaptive_patching.GPUPatchify2D/GPUPatchify3D, dispatched on data.twoD) instead of in the dataloader; only used when do_ap:True. Not used here (do_gpu_ap:False) -- shown so it's easy to find if you turn it on.
  min_size: 2 # Smallest leaf/patch side length either adaptive-patching path will ever produce -- FixedQuadTree/FixedOctTree's own splitting floor on the CPU side, GPUPatchify2D/GPUPatchify3D's finest starting block size on the GPU side.
  score_fn: canny # "canny" (edge-density) or "variance" -- scoring measure deciding where to concentrate patches, shared by the CPU (Patchify/Patchify_3D) and GPU (GPUPatchify2D/GPUPatchify3D) adaptive-patching paths. Only used when do_ap:True.
  canny_sigma: 1.0 # Gaussian smoothing sigma before gradient computation -- shared by the CPU (Patchify/Patchify_3D) and GPU (GPUPatchify2D/GPUPatchify3D) Canny paths. Only used when do_ap:True and score_fn:"canny". Not used here (do_ap:False) -- shown so it's easy to find if you turn it on.
  canny_low_threshold: 0.1 # Lower ("weak" edge) gradient-magnitude threshold -- shared by the CPU (Patchify/Patchify_3D) and GPU (GPUPatchify2D/GPUPatchify3D) Canny paths. Only used when do_ap:True and score_fn:"canny". Not used here (do_ap:False) -- shown so it's easy to find if you turn it on.
  canny_high_threshold: 0.2 # Upper ("strong" edge) gradient-magnitude threshold -- shared by the CPU (Patchify/Patchify_3D) and GPU (GPUPatchify2D/GPUPatchify3D) Canny paths. Only used when do_ap:True and score_fn:"canny". Not used here (do_ap:False) -- shown so it's easy to find if you turn it on.
  canny_hysteresis_iters: 2 # Binary-dilation passes approximating hysteresis edge-linking, GPU path only. Only used when do_gpu_ap:True and score_fn:"canny".

# ---------------------------- DATA ----------------------------------------------
data:
  dataset: "sst"
  # [nz, ny, nx] -- doubles as the per-sample/per-chunk size for "sst", not
  # the true full on-disk domain (that's dataset_options.full_domain_size
  # below) -- see UCF_VIT.utils.misc.process_root_dirs's own docstring.
  # Required explicitly for "sst" (no cheap header to auto-detect from).
  img_size: [256, 256, 256]
  twoD: False
  patch_size: 8 # Only used when do_ap:False (standard patching) -- tile_size (64) / patch_size (8) = 8 tokens per axis, 8^3 = 512 total, matching ap.fixed_length above.
  dict_root_dirs: {
    'P1F4R32': '/lustre/orion/world-shared/stf006/muraligm/CFD135/data_iso/max_ent/binary_data/P1F4R32_training/raw_data/',
  }
  num_channels: {
    'P1F4R32': 10,
  } # u,v,w,r,p at 2 past offsets each (5 variables x 2 timesteps) -- required explicitly for "sst" (no cheap header to auto-detect from)
  dict_in_variables: {
    'P1F4R32': [
     ["u", -2],
     ["v", -2],
     ["w", -2],
     ["r", -2],
     ["p", -2],
     ["u", -1],
     ["v", -1],
     ["w", -1],
     ["r", -1],
     ["p", -1],
    ],
  } # Required for "sst" -- [variable, offset] pairs, real filename prefixes at the real timestamp resolved for each offset (not just labels).
  dict_out_variables: {
    'P1F4R32': [
     ["u", 0],
     ["v", 0],
     ["w", 0],
     ["r", 0],
     ["p", 0],
     ["u", 1],
     ["v", 1],
     ["w", 1],
     ["r", 1],
     ["p", 1],
    ],
  } # Regression target(s) at both future timesteps (offsets 0 and 1), predicted in one shot -- required for "sst" whenever the model returns a label (every model type this dataset supports: UNETR).

# ---------------------------- DATALOADER ----------------------------------------
dataloader:
  type: "iterative_dataloader"
  dict_start_idx: {
    'P1F4R32': 0,
  }
  dict_end_idx: {
    'P1F4R32': 1,
  }
  dict_buffer_sizes: {
    'P1F4R32': 100,
  }
  batch_size: 2
  num_workers: 1
  pin_memory: False
  # Optional -- default 0.1/0.1 when omitted (see UCF_VIT.parse._resolve_dataset_splits).
  # For "sst" time-stepping, this ratio-slice is applied to windows already
  # sorted in real time order (see UCF_VIT.utils.misc.sst_temporal_sort_key),
  # so val/test always cover strictly later real time than train -- no
  # future-to-past leakage.
  val_split_ratio: 0.1
  test_split_ratio: 0.1

# ---------------------------- DATASET SPECIFIC OPTIONS -------------------------------------------
dataset_options:
  # "sst" only -- the true full on-disk domain size [nz, ny, nx] of one raw
  # file, bigger than data.img_size above (the per-chunk size) in the y/x
  # dimensions -- see base_config.yaml's own header comment and
  # UCF_VIT.utils.misc.process_root_dirs's docstring for why.
  full_domain_size: {
    'P1F4R32': [256, 512, 512],
  }

# ---------------------------- INFERENCE OUTPUT -----------------------------------
# Optional, off by default -- only used by test.py/val.py's eval_epoch, and only
# meaningful for model.type:"UNETR". When save:True, each rank saves its own local
# batches' input/label/prediction volumes as NIfTI files (see
# UCF_VIT.utils.inference_output.save_inference_batch) for visual inspection --
# for this regression config, only the first predicted channel (u at offset
# 0) is dumped (see save_inference_batch's own docstring), not all 10.
# Uncomment to turn on:
#inference_output:
#  save: True
#  all_batches: False # True saves every batch in the test set (every rank's local shard); False saves only the first num_batches
#  num_batches: 1 # only used when all_batches:False
#  output_dir: "inference_output"
