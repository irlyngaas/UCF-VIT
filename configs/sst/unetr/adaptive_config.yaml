# UNETR repurposed for regression on the "sst" CFD dataset: predicts
# pressure (p) from velocity/density (r, u, v, w) via model.loss_fn:"MSE"
# and model.num_classes:1, instead of the usual classification/segmentation
# DiceCELoss path -- see UCF_VIT.training.forward_step's own model.loss_fn
# dispatch.
#
# Adaptive-patching (ap.do_ap:True) follow-up to base_config.yaml (which
# stays non-adaptive, confirmed working against real Frontier data first).
# Required a real fix, not just flipping the flag: Patchify_3D's Canny edge
# detection uses absolute hysteresis thresholds tuned for ~[0,1]-scaled
# data (true for basic_ct only because it's min-max normalized once at
# file-read time) -- "sst"'s raw CFD fields are in arbitrary physical
# units, so Patchify_3D now normalizes *only* its edge-detection input for
# dataset:"sst" (per channel, locally), leaving the real patch content
# (what the model actually sees/trains against) at real physical values.
# See Patchify_3D's own docstring.
#
# fixed_length:729 (=9^3, satisfying the octree "7n+1" constraint) and
# interp_size:8 are translated from the old SST branch's config
# (fixed_length:729, patch_size:8 -- that codebase had no separate
# interp_size concept, patch_size served both roles) -- 9^3 == fixed_length
# exactly, so UNETR's reconstructed canvas (sqrt_len=9) loses zero adaptive
# tokens (see parse.py's own "UNETR's decoder bottleneck..." warning, which
# this doesn't trigger).
#
# See base_config.yaml's own header comment for the "sst" data-layout/
# chunking writeup (chunk_size==img_size==256^3, full_domain_size
# 256x512x512, tiling.div:4 -> tile_size 64^3) -- unchanged here, adaptive
# patching is independent of that.

# ---------------------------- TRAINER -------------------------------------------
trainer:
  max_epochs: 600
  data_type: "float32" #float 32 or bfloat16
  gpu_type: "amd" #amd or nvidia
  checkpoint_path: "checkpoint/sst/unetr/adaptive"
  resume_from_checkpoint: False
  checkpoint_filename: "epoch_0"
  use_pretrained_model: False
  pretrained_checkpoint_filename: ""
  save_frequency: 2

# ---------------------------- PARALLELISM ---------------------------------------
parallelism:
  fsdp_size: 1
  simple_ddp_size: "auto" # derives from world_size at launch time (world_size / (fsdp_size * tensor_par_size)) -- see README.md's Parallelism section. Adjust fsdp_size/tensor_par_size for your real allocation size before running at scale.
  tensor_par_size: 1

# ---------------------------- OPTIMIZER -----------------------------------------
optimizer:
  type: "AdamW"
  lr: 0.00001
  beta_1: 0.9
  beta_2: 0.95
  weight_decay: 1e-5

# ---------------------------- SCHEDULER -----------------------------------------
scheduler:
  type: "linear-warmup-cosine-annealing"
  # See base_config.yaml's identical comment -- a starting guess, not a
  # faithful translation of the old branch's step-based schedule.
  warmup_epochs: 10
  warmup_start_lr: 1e-8
  eta_min: 1e-8

# ---------------------------- GRAD SCALER ---------------------------------------
grad_scaler:
  use_grad_scaler: False
  init_scale: 8192
  min_scale: 128
  growth_interval: 100

# ---------------------------- MODEL ---------------------------------------------
model:
  type: "UNETR"
  embed_dim: 768
  depth: 12
  num_heads: 12
  mlp_ratio: 4
  drop_path: 0.0
  drop_rate: 0.0
  use_channel_aggregation: False
  loss_fn: "MSE" # Regression, not classification -- see UCF_VIT.training.forward_step's model.loss_fn dispatch. Requires num_classes:1 below.

  num_classes: 1 # Predicting a single continuous field (p) with MSE, not a real class count -- see model.loss_fn above.
  linear_decoder: False
  feature_size: 16
  skip_connection: True
  token_selection: point # "point" (default), "smallest_overlap", "area_weighted", or "cross_attention" -- see UCF_VIT.model.arch.UNETR._adaptive_token_grid_index/_adaptive_token_grid_weights/_cross_attention_query_and_mask.
  area_weighted_alpha: 0 # Only used when token_selection:area_weighted.

# ---------------------------- TILING --------------------------------------------
tiling:
  do_tiling: True
  div: 4 # data.img_size (256) / div -> tile_size 64 in every dimension.
  tile_overlap: 0
  use_all_data: False

# ---------------------------- AP ------------------------------------------------

ap:
  do_ap: True
  fixed_length: 729 # 9^3 -- see this file's own header comment.
  separate_channels: False
  use_adaptive_pos_emb: True
  interp_size: 8 # Side length each adaptive leaf patch is interpolated to -- see this file's own header comment.

# ---------------------------- DATA ----------------------------------------------
data:
  dataset: "sst"
  # [nz, ny, nx] -- doubles as the per-sample/per-chunk size for "sst", not
  # the true full on-disk domain (that's dataset_options.full_domain_size
  # below) -- see UCF_VIT.utils.misc.process_root_dirs's own docstring.
  # Required explicitly for "sst" (no cheap header to auto-detect from).
  img_size: [256, 256, 256]
  twoD: False
  dict_root_dirs: {
    'P1F4R32': '/lustre/orion/world-shared/stf006/muraligm/CFD135/data_iso/max_ent/binary_data/P1F4R32_training/raw_data/',
  }
  num_channels: {
    'P1F4R32': 4,
  } # r, u, v, w -- required explicitly for "sst" (no cheap header to auto-detect from)
  dict_in_variables: {
    'P1F4R32': [
     "r",
     "u",
     "v",
     "w",
    ],
  } # Required for "sst" -- these are real filename prefixes ("<variable>_<timestamp>"), not just labels.
  dict_out_variables: {
    'P1F4R32': [
     "p",
    ],
  } # Regression target(s) -- required for "sst" whenever the model returns a label (every model type this dataset supports: UNETR).

# ---------------------------- DATALOADER ----------------------------------------
dataloader:
  type: "iterative_dataloader"
  dict_start_idx: {
    'P1F4R32': 0,
  }
  dict_end_idx: {
    'P1F4R32': 1,
  }
  dict_buffer_sizes: {
    'P1F4R32': 100,
  }
  batch_size: 2
  num_workers: 1
  pin_memory: False
  # Optional -- default 0.1/0.1 when omitted (see UCF_VIT.parse._resolve_dataset_splits).
  val_split_ratio: 0.1
  test_split_ratio: 0.1

# ---------------------------- DATASET SPECIFIC OPTIONS -------------------------------------------
dataset_options:
  # "sst" only -- the true full on-disk domain size [nz, ny, nx] of one raw
  # file, bigger than data.img_size above (the per-chunk size) in the y/x
  # dimensions -- see base_config.yaml's own header comment and
  # UCF_VIT.utils.misc.process_root_dirs's docstring for why.
  full_domain_size: {
    'P1F4R32': [256, 512, 512],
  }

# ---------------------------- INFERENCE OUTPUT -----------------------------------
# Optional, off by default -- only used by test.py/val.py's eval_epoch, and only
# meaningful for model.type:"UNETR". When save:True, each rank saves its own local
# batches' input/label/prediction volumes as NIfTI files (see
# UCF_VIT.utils.inference_output.save_inference_batch) for visual inspection --
# for this regression config, the prediction is the raw continuous field, not an
# argmaxed class index (see save_inference_batch's own docstring).
# Uncomment to turn on:
#inference_output:
#  save: True
#  all_batches: False # True saves every batch in the test set (every rank's local shard); False saves only the first num_batches
#  num_batches: 1 # only used when all_batches:False
#  output_dir: "inference_output"
