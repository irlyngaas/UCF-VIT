# ---------------------------- TRAINER -------------------------------------------
trainer:
  max_epochs: 100
  data_type: "float32" #float 32 or bfloat16
  gpu_type: "amd" #amd or nvidia
  checkpoint_path: "../../checkpoint/catsdogs/diffusion/base"
  resume_from_checkpoint: False
  checkpoint_filename: "epoch_0"
  use_pretrained_model: False
  pretrained_checkpoint_filename: ""
  save_frequency: 2

# ---------------------------- PARALLELISM ---------------------------------------
parallelism:
  fsdp_size: 1
  simple_ddp_size: 8
  tensor_par_size: 1

# ---------------------------- OPTIMIZER -----------------------------------------
optimizer:
  type: "AdamW"
  lr: 0.0001
  beta_1: 0.9
  beta_2: 0.95
  weight_decay: 1e-5

# ---------------------------- SCHEDULER -----------------------------------------
scheduler:
  type: "linear-warmup-cosine-annealing"
  warmup_epochs: 4
  warmup_start_lr: 1e-8
  eta_min: 1e-8

# ---------------------------- GRAD SCALER ---------------------------------------
grad_scaler:
  use_grad_scaler: False
  init_scale: 8192
  min_scale: 128
  growth_interval: 100

# ---------------------------- MODEL ---------------------------------------------
model:
  type: "DiffusionVIT"
  embed_dim: 768
  depth: 12
  num_heads: 12
  mlp_ratio: 4
  drop_path: 0.0
  drop_rate: 0.0
  use_channel_aggregation: False

  num_time_steps: 1000
  linear_decoder: False
  decoder_embed_dim: 576
  decoder_depth: 8
  decoder_num_heads: 16
  decoder_mlp_ratio: 4
  
# ---------------------------- TILING --------------------------------------------
tiling:
  do_tiling: False
  div: 1
  tile_overlap: 0
  use_all_data: False

# ---------------------------- AP ------------------------------------------------

ap:
  do_ap: False
  fixed_length: 196
  separate_channels: False
  use_adaptive_pos_emb: True
  
# ---------------------------- DATA ----------------------------------------------
data:
  dataset: "catsdogs"
  img_size: [256, 256] #Can be 2D or 3D. Optional -- if omitted, auto-detected from the real data files under dict_root_dirs (see UCF_VIT.utils.misc.detect_img_size). Always the actual/native size of the data, never a resize target.
  twoD: True #If true when img_size is 3D, dataloader slices on the z dimension. If data is 2D, this variable will be ignored and default to True
  patch_size: 16 #If non-adaptive patching this will change sequence length, if adaptive patching this will determine the common representation across all adaptive patches
  dict_root_dirs: {
    'catsdogs': '/lustre/orion/stf006/world-shared/irl1/CatsDogs/train',
  }
  num_channels: {
    'catsdogs': 3,
  } #Important to define because not all datasets need to have the same channels or amount of channels when using variable aggregation depending on the training task chosen
  dict_in_variables: {
    'catsdogs': [
     "red", 
     "green", 
     "blue", 
    ],
  } #Needs to match the order of the channels in the raw data files, if using variable aggregation. If not using variable aggregation you may just fill this in with placeholders using the correct amount of channels as this will not be used
  
# ---------------------------- DATALOADER ----------------------------------------
dataloader:
  type: "dataloader"
  batch_size: 32
  num_workers: 1
  pin_memory: False

# ---------------------------- DATASET SPECIFIC OPTIONS -------------------------------------------
dataset_options:

  resize: {
      'catsdogs': [256,256],
    } #Optional -- real cat/dog photos have varying native sizes, so this resizes them to a common size before training. Omit to train at each photo's native size instead (only viable if every real file under dict_root_dirs already shares the same size).

